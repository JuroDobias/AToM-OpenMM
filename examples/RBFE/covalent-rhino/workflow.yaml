workflow:
  type: rbfe
  mode: covalent
  dataset: ../../../../rhino_benchmarks/normalized/dataset.yaml
  workdir: run
  pairs:
  - ligand_a: I79DJ_543
    ligand_b: LIBA225
  platform: CUDA
  platform_properties:
    Precision: mixed
  setup:
    protein_forcefield: amber19/protein.ff19SB.xml
    water_forcefield: amber19/opc.xml
    ligand_forcefield: openff-2.2.1.offxml
    ligand_charge_model: espaloma_nn
    espaloma_model: espaloma-0.3.2
    solvent_padding_a: 10.0
    ionic_strength_molar: 0.15
    dummy_bonded_scales:
      bond: 1.0
      angle: 1.0
      proper_torsion: 1.0
      junction_angle: 1.0
      junction_proper_torsion: 0.0
  neqti:
    temperature_k: 300.0
    pressure_bar: 1.0
    timestep_fs: 2.0
    endpoint_equilibration:
      minimization_tolerance_kj_mol_nm: 10.0
      minimization_max_iterations: 2000
      nvt_steps: 50000
      nvt_timestep_fs: 1.0
      npt_steps: 250000
      npt_timestep_fs: 2.0
    n_snapshots: 10
    decorrelation_steps: 100000
    interpolation: softcore_linear
    softcore:
      alpha: 0.3
      sigma_nm: 0.25
      power: 1
      charge_steps_per_stage: 10000
      sterics_steps: 30000
    failed_switch_policy: count_as_infinite
    bootstrap_samples: 500
    random_seed: 2026
    rest2:
      enabled: true
      effective_temperatures_k: [300.0, 344.6, 395.9, 454.7, 522.3, 600.0]
      exchange_interval_steps: 500
      checkpoint_interval_cycles: 10
