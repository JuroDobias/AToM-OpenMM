workflow:
  type: rbfe
  chemistry: noncovalent
  alchemy:
    model: hybrid_topology
    cycle: complex_solvent
    mapping:
      method: mcs
  sampling:
    method: neqti
  workdir: hybrid_neqti
  receptor: receptor/cdk2.pdb
  ligands_dir: ligands
  pairs:
    - [H1Q, H1R]
  setup:
    protein_forcefield: [amber14-all.xml]
    solvent_forcefield: [amber14/tip3p.xml]
    solvent_model: tip3p
    ligand_forcefield: espaloma-0.3.2
    ligand_charge_model: nn
    solvent_padding_a: 10.0
    ionic_strength_molar: 0.15
    dummy_bonded_scales:
      bond: 1.0
      angle: 1.0
      proper_torsion: 1.0
      junction_angle: 1.0
      junction_proper_torsion: 1.0
  neqti:
    temperature_k: 300.0
    pressure_bar: 1.0
    timestep_fs: 2.0
    endpoint_equilibration:
      minimization_tolerance_kj_mol_nm: 10.0
      minimization_max_iterations: 2000
      nvt_steps: 50000
      nvt_timestep_fs: 1.0
      npt_steps: 250000
      npt_timestep_fs: 2.0
    n_snapshots: 10
    decorrelation_steps: 100000
    interpolation: softcore_linear
    softcore:
      function: beutler
      alpha: 0.3
      sigma_nm: 0.25
      power: 1
      charge_steps_per_stage: 10000
      sterics_steps: 30000
      long_range_correction: dynamic
    failed_switch_policy: count_as_infinite
    bootstrap_samples: 500
    random_seed: 2026
    rest2:
      enabled: false
