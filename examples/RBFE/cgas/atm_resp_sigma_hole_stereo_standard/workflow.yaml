workflow:
  type: rbfe
  chemistry: noncovalent
  alchemy:
    model: atm
    cycle: transfer
  sampling:
    method: neqti
  workdir: run
  receptor: ../hybrid_imidazole_oxazole6O/inputs/protein.pdb
  ligands_dir: ligands
  pairs:
    - [ms_491, ms_492]
  reference_ligand: ms_491
  reference_alignment_atoms: [3, 7, 11]
  alignments_out: alignments.yaml
  forcefield_cache: ff.json
  platform: CUDA
  platform_properties:
    Precision: mixed
  run: true
  analyze: true

  setup:
    mode: openmmforcefields
    protein_forcefield:
      - amber14-all.xml
      - ../hybrid_imidazole_oxazole6O/inputs/ATP.xml
    solvent_forcefield:
      - amber14/tip4pew.xml
    solvent_model: tip4pew
    ligand_forcefield: gaff-2.2.20
    ligand_charge_model: resp-sigma-hole
    ligand_parameter_cache: /home/jurajdobias/myAToM/ligand_parameter_cache/gaff2_resp_cl_ep
    ligand_parameter_protocol: gaff2-resp-halogen-ep-v2
    metal_ions:
      model: standard_12_6

  equilibration:
    pre_atm:
      steps:
        - id: restrained_minimization
          type: minimization
          tolerance_kj_mol_nm: 10.0
          max_iterations: 1000
          positional_restraints:
            mask: '!@H= & !:L1,L2,HOH,WAT,NA,CL,K,CA,MG,ZN'
            k_kcal_mol_a2: 10.0
            tolerance_a: 0.05
        - id: restrained_nvt
          type: md
          ensemble: NVT
          n_steps: 25000
          timestep_ps: 0.002
          reset_velocities: true
          thermostat: {temperature_k: 300.0, friction_per_ps: 1.0}
          positional_restraints:
            mask: '!@H= & !:L1,L2,HOH,WAT,NA,CL,K,CA,MG,ZN'
            k_kcal_mol_a2: 5.0
            tolerance_a: 0.25
          reporters:
            state: {interval: 5000}
        - id: restrained_npt
          type: md
          ensemble: NPT
          n_steps: 50000
          timestep_ps: 0.002
          thermostat: {temperature_k: 300.0, friction_per_ps: 1.0}
          positional_restraints:
            mask: '!@H= & !:L1,L2,HOH,WAT,NA,CL,K,CA,MG,ZN'
            k_kcal_mol_a2: 2.0
            tolerance_a: 0.5
          reporters:
            state: {interval: 5000}
        - id: unrestrained_npt
          type: md
          ensemble: NPT
          n_steps: 50000
          timestep_ps: 0.002
          thermostat: {temperature_k: 300.0, friction_per_ps: 1.0}
          reporters:
            state: {interval: 5000}
    neqti:
      endpoint:
        steps:
          - id: endpoint_minimization
            type: minimization
            tolerance_kj_mol_nm: 10.0
            max_iterations: 1000
            positional_restraints:
              mask: '!@H= & !:L1,L2,HOH,WAT,NA,CL,K,CA,MG,ZN'
              k_kcal_mol_a2: 5.0
              tolerance_a: 0.1
          - id: endpoint_nvt
            type: md
            ensemble: NVT
            n_steps: 25000
            timestep_ps: 0.002
            reset_velocities: true
            thermostat: {temperature_k: 300.0, friction_per_ps: 1.0}
            positional_restraints:
              mask: '!@H= & !:L1,L2,HOH,WAT,NA,CL,K,CA,MG,ZN'
              k_kcal_mol_a2: 1.0
              tolerance_a: 0.5
            reporters:
              state: {interval: 5000}
          - id: endpoint_npt
            type: md
            ensemble: NPT
            n_steps: 50000
            timestep_ps: 0.002
            thermostat: {temperature_k: 300.0, friction_per_ps: 1.0}
            reporters:
              state: {interval: 5000}

  neqti:
    initial_equilibration_steps: 5000
    n_snapshots: 2
    decorrelation_steps: 5000
    switch_steps_per_segment: 250
    preparation_annealing_steps_per_segment: 250
    switch_integrator: custom
    validate_switch_integrator: true
    tolerate_failed_switches: false
    resume: true
    bootstrap_samples: 0
    rest2:
      enabled: false

